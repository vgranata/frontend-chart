apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
{{ include "chart.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "chart.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "chart.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ template "chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      priorityClassName: high-priority  
      volumes:
      - name: frontend-config-volume 
        configMap:
          name: frontend-config
      - name: frontend-files
        persistentVolumeClaim:
          claimName: frontend-files
      - name: init-script
        configMap:
          name: frontend-init-script
          defaultMode: 0555
      {{- if .Values.backup.enabled | default false }}
      - name: backups
        persistentVolumeClaim:
          claimName: backups
      {{- end }}
      - name: patched-files
        emptyDir: {}
      - name: mmoda-module-dir
        emptyDir: {}
      - name: jquery-serializejson-lib
        emptyDir: {}
      - name: bootstrap-mmoda-theme-dir
        emptyDir: {}
      {{- if .Values.extra_instr_dir.enabled }}
      - name: instruments-dir
        persistentVolumeClaim:
          claimName: instruments-dir
      {{- end }}
          #{{ if .Values.dev_space_volume.enabled }}
          #      - name: frontend-dev
          #        {{- toYaml .Values.dev_space_volume.volume | nindent 8 }}
          #      {{ end }}
      initContainers:
        - name: frontend-initialiser
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}        
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ['/init-script.sh']
          volumeMounts:
            - name: frontend-config-volume
              mountPath: /frontend-config
              readOnly: true
            - name: init-script
              mountPath: /init-script.sh
              subPath:  init-script.sh
            - name: patched-files
              mountPath: /patched-files
              readOnly: false
            - name: frontend-files
              mountPath: /var/www/mmoda/sites/default/files
              readOnly: false
            - name: mmoda-module-dir
              mountPath: /mmoda-module-src
              readOnly: false
            - name: jquery-serializejson-lib
              mountPath: /var/www/mmoda/sites/all/libraries/jquery.serializeJSON
              readOnly: false
            - name: bootstrap-mmoda-theme-dir
              mountPath: /bootstrap-mmoda-theme-src
              readOnly: false
            {{- if .Values.extra_instr_dir.enabled }}
            - name: instruments-dir
              mountPath: /instruments-dir
              readOnly: false
            {{- end }}
            {{- if .Values.backup.enabled | default false }}
            - name: backups
              mountPath: /backups
              readOnly: true
            {{- end }}
          env:
            - name: MYSQL_PASSWORD
              valueFrom: 
                secretKeyRef:
                  name: {{ .Values.mysql_pw_secret }}
                  key: mysql-password
            - name: DRUPAL_PW
              valueFrom: 
                secretKeyRef:
                  name: {{ .Values.frontend_secret }}
                  key: drupal-pw
            - name: JWT_KEY
              valueFrom: 
                secretKeyRef:
                  name: {{ .Values.frontend_secret }}
                  key: jwt-key
            - name: swiftmailer_smtp_host
              valueFrom: 
                secretKeyRef:
                  name: {{ .Values.frontend_secret }}
                  key: swiftmailer_smtp_host
            - name: swiftmailer_smtp_port
              valueFrom: 
                secretKeyRef:
                  name: {{ .Values.frontend_secret }}
                  key: swiftmailer_smtp_port
            - name: swiftmailer_smtp_username
              valueFrom: 
                secretKeyRef:
                  name: {{ .Values.frontend_secret }}
                  key: swiftmailer_smtp_username
            - name: swiftmailer_smtp_password
              valueFrom: 
                secretKeyRef:
                  name: {{ .Values.frontend_secret }}
                  key: swiftmailer_smtp_password
            - name: swiftmailer_smtp_encryption
              valueFrom: 
                secretKeyRef:
                  name: {{ .Values.frontend_secret }}
                  key: swiftmailer_smtp_encryption
            - name: openid_client_id
              valueFrom: 
                secretKeyRef:
                  name: {{ .Values.frontend_secret }}
                  key: openid_client_id
            - name: openid_client_secret
              valueFrom: 
                secretKeyRef:
                  name: {{ .Values.frontend_secret }}
                  key: openid_client_secret
            - name: MMODA_MODULES_FORCE_ENABLE
              value: {{ join "," .Values.static_modules }}
            - name: JWT_EXPIRATION
              value: "{{ .Values.jwt_link_expiration }}"
            - name: JWT_URL
              value: {{ .Values.jwt_link_url }}
            - name: SITE_EMAIL_FROM
              value: {{ .Values.email.site_email_from }}
            - name: EMAILS_TO
              value: {{ join "," .Values.email.notification_emails_to }}
        
        {{- if and .Values.module_controller.enabled .Values.extra_instr_dir.enabled }}
        - name: drupal-module-controller
          # Setting restartPolicy: Always makes this a sidecar container.
          # https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/
          restartPolicy: Always
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.module_controller.image.repository }}:{{ .Values.module_controller.image.tag }}"
          imagePullPolicy: {{ .Values.module_controller.image.pullPolicy }}
          ports:
            - name: modules
              containerPort: {{ .Values.module_controller.ports.container }}
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: modules
            failureThreshold: 5
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 30

          readinessProbe:
            httpGet:
              path: /openapi.json
              port: modules
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10

          env:
           - name: ODA_JWT_SECRET
             valueFrom:
               secretKeyRef:
                 name: {{ .Values.frontend_secret }}
                 key: jwt-key
          
          volumeMounts:
          - name: patched-files
            mountPath: /var/www/mmoda/sites/default/settings.php
            subPath: settings.php
            readOnly: true
          - name: instruments-dir
            mountPath: /var/www/mmoda/sites/all/modules/mmoda/instruments
            readOnly: false
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -ex
              # sites/all/modules/mmoda ships broken (self-referential symlink) in
              # some image tags; point it at the real checkout the init container
              # populated into the shared /mmoda-module-src volume instead. See
              # config/init-script.sh for the matching fix on the init container side.
              rm -rf /var/www/mmoda/sites/all/modules/mmoda
              ln -s /mmoda-module-src /var/www/mmoda/sites/all/modules/mmoda
              # sites/all/themes/bootstrap_mmoda ships broken (symlink to
              # ../../../../bootstrap_mmoda/, which doesn't exist) in some image
              # tags -- same defect class as the module symlink above. Point it at
              # the real checkout the init container populated into the shared
              # /bootstrap-mmoda-theme-src volume instead.
              rm -rf /var/www/mmoda/sites/all/themes/bootstrap_mmoda
              ln -s /bootstrap-mmoda-theme-src /var/www/mmoda/sites/all/themes/bootstrap_mmoda
              exec docker-php-entrypoint apache2-foreground
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.mmoda_prefix }}
              port: http
            failureThreshold: 20
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 60
          readinessProbe:
            httpGet:
              path: {{ .Values.mmoda_prefix }}
              port: http
            failureThreshold: 20
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 60
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          #env:
          volumeMounts:
          - name: frontend-config-volume
            mountPath: /etc/apache2/sites-enabled/default-ssl.conf
            subPath: etc-apache2-site-ssl.conf
            readOnly: true
          - name: frontend-config-volume
            mountPath: /etc/apache2/apache2.conf
            subPath: etc-apache2.conf
            readOnly: true
          - name: patched-files
            mountPath: /var/www/mmoda/sites/default/settings.php
            subPath: settings.php
            readOnly: true
          - name: frontend-files
            mountPath: /var/www/mmoda/sites/default/files
            readOnly: false
          - name: mmoda-module-dir
            mountPath: /mmoda-module-src
            readOnly: true
          - name: jquery-serializejson-lib
            mountPath: /var/www/mmoda/sites/all/libraries/jquery.serializeJSON
            readOnly: true
          - name: bootstrap-mmoda-theme-dir
            mountPath: /bootstrap-mmoda-theme-src
            readOnly: true
          # {{ if .Values.dev_space_volume.enabled }}
          # - name: frontend-dev
          #   mountPath: /var/www/mmooda/dev
          #   subPath: {{ .Values.dev_space_volume.subPath }}
          #   readOnly: true                
          # {{ end }}
          {{- if .Values.extra_instr_dir.enabled }}
          - name: instruments-dir
            mountPath: /var/www/mmoda/sites/all/modules/mmoda/instruments
            readOnly: false
          {{- end }}
        {{- if .Values.backup.enabled | default false }}
        - name: backup
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
          - bash
          - -c
          - |
            set -x
            while true; do 
              mysqldump -h mysql -u astrooda -p$PASSWORD --no-tablespace astrooda > /backups/state-snapshot-$(date +%s).sql              
              sleep 3600; 
            done


          volumeMounts:
            - name: backups
              mountPath: /backups
              readOnly: false
          env:
            - name: PASSWORD
              valueFrom: 
                secretKeyRef:
                  name: {{ .Values.mysql_pw_secret }}
                  key: mysql-password
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}

